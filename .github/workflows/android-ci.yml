name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalogs:
    name: Validate offline catalogs and package identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog structure, bilingual IDs, and package identity
        run: python scripts/validate_catalogs.py

  android:
    name: Android tests and build variants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Assemble release APK variant
        run: gradle --no-daemon assembleRelease
      - name: Build release Android App Bundle
        run: gradle --no-daemon bundleRelease
      - name: Upload release AAB for reference
        uses: actions/upload-artifact@v4
        with:
          name: my-wishes-release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
